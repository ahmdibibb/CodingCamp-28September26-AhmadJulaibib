<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Budget Visualizer</title>
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Error banner -->
    <div id="app-error" role="alert" aria-live="assertive" hidden></div>

    <div class="app-container">
      <header class="app-header">
        <h1 class="app-title">Expense Tracker</h1>
      </header>

      <main>
        <!-- Balance Display -->
        <section class="balance-section" aria-label="Total Balance">
          <p class="balance-label">Total Balance</p>
          <p id="balance-display" class="balance-amount">Rp0.00</p>
        </section>

        <!-- Transaction Input Form -->
        <section class="form-section" aria-label="Add Transaction">
          <h2 class="section-title">Add Transaction</h2>
          <form id="input-form" novalidate>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input
                type="text"
                id="item-name"
                name="item-name"
                maxlength="100"
                placeholder="e.g. Coffee"
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label for="amount">Amount (Rp)</label>
              <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                max="999999.99"
                step="0.01"
                placeholder="0.00"
              />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>

            <div id="form-errors" role="alert" aria-live="polite"></div>

            <button type="submit" id="btn-add" class="btn btn-primary">
              Add Transaction
            </button>
          </form>
        </section>

        <!-- Spending Limit -->
        <section class="spending-limit-section" aria-label="Spending Limit">
          <h2 class="section-title">Spending Limit</h2>
          <div class="spending-limit-controls">
            <label for="spending-limit-input">Set Limit (Rp)</label>
            <input
              type="number"
              id="spending-limit-input"
              name="spending-limit-input"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="e.g. 50.00"
            />
            <button type="button" id="btn-set-limit" class="btn btn-secondary">
              Set Limit
            </button>
          </div>
          <div id="spending-limit-error" role="alert" aria-live="polite"></div>
        </section>

        <!-- View Toggle -->
        <section class="view-toggle-section">
          <button type="button" id="btn-toggle-view" class="btn btn-secondary">
            Switch to Monthly Summary
          </button>
        </section>

        <!-- Transaction List -->
        <section class="list-section" aria-label="Transaction History">
          <h2 class="section-title">Transactions</h2>

          <!-- Sort Controls -->
          <div class="sort-controls" id="sort-controls">
            <label for="sort-criterion">Sort by:</label>
            <select id="sort-criterion" name="sort-criterion">
              <option value="">Default (newest first)</option>
              <option value="amount-asc">Amount: Low to High</option>
              <option value="amount-desc">Amount: High to Low</option>
              <option value="category-asc">Category: A–Z</option>
            </select>
          </div>

          <div id="transaction-list" aria-live="polite"></div>
        </section>

        <!-- Monthly Summary View -->
        <section id="monthly-summary" class="monthly-section" aria-label="Monthly Summary" hidden>
          <h2 class="section-title">Monthly Summary</h2>
          <div id="monthly-summary-content"></div>
        </section>

        <!-- Chart Section -->
        <section class="chart-section" aria-label="Spending Chart">
          <h2 class="section-title">Spending by Category</h2>
          <div class="chart-wrapper">
            <canvas id="spending-chart" role="img" aria-label="Pie chart of spending by category"></canvas>
            <div id="chart-placeholder" class="chart-placeholder">No data available</div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
